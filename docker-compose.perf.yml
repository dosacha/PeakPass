services:
  app:
    environment:
      LOG_LEVEL: warn
      GRAPHQL_RATE_LIMIT_MAX_REQUESTS: 100000
      GRAPHQL_RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 100000
      RATE_LIMIT_WINDOW_MS: 60000
    command: >
      sh -c "npm run build && npm run migrate:up && npm run seed && npm run start"
